name: Build and Push Microservices to GHCR

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'k8s/**'
      - 'scripts/**'
      - 'frontend/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ghcr-build-and-push
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
            image_name: expense-api-gateway
          - service: expense-service
            dockerfile: services/expense-service/Dockerfile
            image_name: expense-service
          - service: receipt-ocr-service
            dockerfile: services/receipt-ocr-service/Dockerfile
            image_name: expense-receipt-ocr-service
          - service: expense-agent-service
            dockerfile: services/expense-agent-service/Dockerfile
            image_name: expense-agent-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        id: image_info
        run: |
          IMAGE_PATH="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}"
          echo "image_path=${IMAGE_PATH,,}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_info.outputs.image_path }}
          tags: |
            type=raw,value=latest,enable=true
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
